<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sýkorkina misia – dočasne mimo prevádzky</title>
<meta name="description" content="Stránka Sýkorkina misia je dočasne mimo prevádzky.">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#3B82F6">
<style>
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;
    background:linear-gradient(135deg,#eff6ff 0%,#fef3c7 100%);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#1f2937}
  .card{max-width:460px;width:100%;background:rgba(255,255,255,.9);border-radius:28px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);padding:36px 28px;text-align:center}
  img{width:96px;height:96px;animation:sway 3s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
  h1{font-size:1.6rem;font-weight:900;margin:16px 0 10px}
  p{line-height:1.6;color:#4b5563}
  .brand{margin-top:22px;font-weight:800;color:#3B82F6}
  .brand span{color:#F59E0B}
</style>
</head>
<body>
  <main class="card">
    <img src="/favicon.svg" alt="" aria-hidden="true">
    <h1>Sýkorka si dala prestávku 🐦</h1>
    <p>Stránka Sýkorkina misia je dočasne mimo prevádzky.<br>Ďakujeme za trpezlivosť.</p>
    <p class="brand">Misia9<span>.sk</span></p>
  </main>
</body>
</html>
