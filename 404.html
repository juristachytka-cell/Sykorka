<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stránka sa nenašla | Sýkorkina misia</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#3B82F6">
<style>
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;
    background:linear-gradient(135deg,#eff6ff 0%,#fef3c7 100%);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#1f2937}
  .card{max-width:460px;width:100%;background:rgba(255,255,255,.92);border-radius:28px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);padding:36px 28px;text-align:center}
  img{width:88px;height:88px}
  h1{font-size:1.5rem;font-weight:900;margin:16px 0 8px}
  p{line-height:1.6;color:#4b5563}
  a.btn{display:inline-block;margin-top:20px;background:#3B82F6;color:#fff;font-weight:800;text-decoration:none;padding:12px 22px;border-radius:14px}
  a.btn:hover{background:#2563eb}
</style>
</head>
<body>
  <main class="card">
    <img src="/favicon.svg" alt="" aria-hidden="true">
    <h1>Tu sýkorka nič nenašla 🐦</h1>
    <p>Táto stránka neexistuje alebo sa presťahovala.</p>
    <a class="btn" href="/">Späť na hru</a>
  </main>
</body>
</html>
